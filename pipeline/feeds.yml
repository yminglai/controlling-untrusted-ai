# Feed list for pipeline/collect_news.py
#
# Every enabled URL below was fetched with requests and parsed with xml.etree on
# 2026-10-17 (see `checked`). Entries that returned HTML, 403 or 404 on that date
# are kept at the bottom under `disabled:` with the reason, so they can be retried.
#
# Fields
#   id         stable short id, used as the item's `lens` ("feed:<id>") and by --only
#   name       display name
#   url        feed URL (RSS 2.0, Atom, RSS 1.0/RDF, or an arXiv API query)
#   type       rss | atom | arxiv | github-issues   (parser auto-detects; type is informational)
#   publisher  value written to the stream item's `publisher` field
#   group      press | vendor | safety | security | policy | community | arxiv | submissions
#   weight     0..1 prior that an entry is about deploying or operating AI agents.
#              Used to (a) order candidates before --limit truncation, (b) bypass the
#              keyword prefilter when >= 0.9, (c) seed the heuristic classifier's confidence.
#   evidence   default SCHEMA.md `evidence` value for items from this feed
#   checked    date the URL was last verified to return a parseable feed

defaults:
  timeout: 20            # seconds per request
  max_items_per_feed: 200
  user_agent: "controlling-untrusted-ai-collector/0.1 (+https://github.com/yminglai/controlling-untrusted-ai)"

